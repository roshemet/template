# The family's bank run (Roshemet). Once a day on GitHub's schedule, and whenever "Run workflow" is pressed.
#
# Each bank login is a secret of this repo (LOGIN_<COMPANY>), set by `github-connect` or the setup app; GitHub keeps
# it encrypted and gives it only to the "Bank run" step below. The agent hides every value from this log before it
# prints anything, and never runs if this repo is public. The rows go to your app, which asks you to approve them.
#
# The agent's version is in roshemet.json. Each run installs that release only after checking GitHub's attestation
# that roshemet/agent's own release workflow built it. update.yml moves to a newer release.
#
# Please do not edit this file: a change here could expose the logins. Questions: the README.
name: Bank run

on:
  schedule:
    # 07:00 UTC: 10:00 Israel time in summer, 09:00 in winter (GitHub may start it later). Not on Saturday; on
    # Yom Tov the agent itself does not run.
    - cron: '0 7 * * SUN-FRI'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back (0: only a check, no bank)'
        type: number
        default: 45

permissions:
  contents: read

concurrency:
  group: bank-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: roshemet.json (the agent's version)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: roshemet.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: The agent, as released (its provenance checked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -e "const v = require('./roshemet.json').agent; if (!/^\d+\.\d+\.\d+$/.test(v)) process.exit(1); console.log(v)") \
            || { echo "roshemet.json has no agent version (like 1.1.0)."; exit 1; }
          cd "$RUNNER_TEMP"
          gh release download "v$v" --repo roshemet/agent --pattern "roshemet-agent-$v.tgz" --pattern "roshemet-agent-$v.tgz.sigstore.json"
          gh attestation verify "roshemet-agent-$v.tgz" --bundle "roshemet-agent-$v.tgz.sigstore.json" --repo roshemet/agent \
            --signer-workflow roshemet/agent/.github/workflows/release.yml --source-ref "refs/tags/v$v" --deny-self-hosted-runners
          mkdir agent
          tar -xzf "roshemet-agent-$v.tgz" -C agent --strip-components=1
          cd agent
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: The scrape log of earlier runs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.roshemet/scrape-log.jsonl
          key: roshemet-log-${{ github.run_id }}
          restore-keys: roshemet-log-

      - name: Bank run
        env:
          DAYS: ${{ inputs.days }}
          GITHUB_TOKEN: ${{ github.token }}
          FINANCE_SCRAPER_CHROME: /usr/bin/google-chrome
          ROSHEMET_APP: ${{ vars.ROSHEMET_APP }}
          ROSHEMET_MAP: ${{ vars.ROSHEMET_MAP }}
          ROSHEMET_TOKEN: ${{ secrets.ROSHEMET_TOKEN }}
          LOGIN_HAPOALIM: ${{ secrets.LOGIN_HAPOALIM }}
          LOGIN_LEUMI: ${{ secrets.LOGIN_LEUMI }}
          LOGIN_MIZRAHI: ${{ secrets.LOGIN_MIZRAHI }}
          LOGIN_DISCOUNT: ${{ secrets.LOGIN_DISCOUNT }}
          LOGIN_MERCANTILE: ${{ secrets.LOGIN_MERCANTILE }}
          LOGIN_OTSARHAHAYAL: ${{ secrets.LOGIN_OTSARHAHAYAL }}
          LOGIN_MAX: ${{ secrets.LOGIN_MAX }}
          LOGIN_VISACAL: ${{ secrets.LOGIN_VISACAL }}
          LOGIN_ISRACARD: ${{ secrets.LOGIN_ISRACARD }}
          LOGIN_AMEX: ${{ secrets.LOGIN_AMEX }}
          LOGIN_UNION: ${{ secrets.LOGIN_UNION }}
          LOGIN_BEINLEUMI: ${{ secrets.LOGIN_BEINLEUMI }}
          LOGIN_MASSAD: ${{ secrets.LOGIN_MASSAD }}
          LOGIN_YAHAV: ${{ secrets.LOGIN_YAHAV }}
          LOGIN_BEYAHADBISHVILHA: ${{ secrets.LOGIN_BEYAHADBISHVILHA }}
          LOGIN_ONEZERO: ${{ secrets.LOGIN_ONEZERO }}
          LOGIN_BEHATSDAA: ${{ secrets.LOGIN_BEHATSDAA }}
          LOGIN_PAGI: ${{ secrets.LOGIN_PAGI }}
        run: node "$RUNNER_TEMP/agent/scrape.mjs" github-run --days "$DAYS"

      - name: Keep the scrape log for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.roshemet/scrape-log.jsonl
          key: roshemet-log-${{ github.run_id }}
